sonar.projectKey=year2-se1
sonar.projectName=Year2_SE1
sonar.projectVersion=sprint6
sonar.sourceEncoding=UTF-8

sonar.sources=backend
sonar.tests=backend/tests

sonar.python.version=3.12
sonar.python.coverage.reportPaths=backend/coverage.xml

sonar.exclusions=**/.venv/**,**/venv/**,**/node_modules/**,**/htmlcov/**,**/coverage/**,**/__pycache__/**,**/*.min.js,**/fix_db.py
sonar.test.inclusions=backend/tests/**/*.py

# Use the main branch as the reference to avoid new-code gating on the main branch
sonar.newCode.referenceBranch=main